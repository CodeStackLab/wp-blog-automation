# Alternative Docker Compose Configuration
# Use this if ports 80/443 are already in use by another web server

version: '3.8'

services:
  # WordPress Automation Web App
  wp-automation-app:
    build: ./app
    container_name: wp_automation_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=change_this_to_random_secret_key
    volumes:
      - ./app:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - wp-network

  # Nginx Reverse Proxy with SSL (using alternative ports)
  nginx:
    image: nginx:alpine
    container_name: wp_nginx
    restart: unless-stopped
    ports:
      - "8080:80"      # HTTP on port 8080
      - "8443:443"     # HTTPS on port 8443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - wp-automation-app
    networks:
      - wp-network

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: wp_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - wp-network

networks:
  wp-network:
    driver: bridge
